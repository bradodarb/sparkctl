# Generated by `sparkctl create recipe` — edit freely.
# DGX Spark defaults baked in: fast (no-mmap) weight loading; for multinode
# (tensor>=2) RAY_memory_monitor_refresh_ms=0 avoids spurious Ray OOM kills.
name: nemotron-3-super-nvfp4
services:
- name: agent
  engine: vllm
  provider: hf
  model: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
  served_name: nemotron-3-super-nvfp4
  nodes:
    - coach
    - ref
  port: 8000
  max_model_len: 262144
  gpu_memory_utilization: 0.85
  tool_call_parser: qwen3_coder
  reasoning_parser: nemotron_v3   # Nemotron-3-Super reasoning parser (vLLM registers it as
                                  # "nemotron_v3", not "super_v3"); present in both csv-vllm images
  extra_args:
  - --load-format=safetensors
  - --safetensors-load-strategy=eager
  env:
    VLLM_USE_FLASHINFER_MOE_FP4: '1'
