# Conversation-tuning variant of qwen3.6-27b-nvfp4 — A/B against the baseline for multi-turn chat.
# Qwen3.6-27B is a DENSE 27B (qwen3_5_text, 64 layers, GQA 4 KV heads, head_dim 256; no MoE, no MTP).
# Decode is memory-bandwidth bound on GB10 (~273 GB/s) -> ~18-20 tok/s single-stream ceiling regardless
# of tuning. The slowdown under 2-6 concurrent conversations is NOT KV capacity (the pool is ~380k
# tokens/replica and barely used) — it's that every multi-turn/reasoning turn re-prefills the whole
# growing history, and that prefill steals decode cycles. These knobs stop that degradation.
name: qwen3.6-27b-nvfp4-tuned
services:
- name: agent
  engine: vllm
  provider: hf
  model: nvidia/Qwen3.6-27B-NVFP4
  served_name: qwen3.6-27b-nvfp4-tuned   # distinct name so it A/Bs cleanly (own dashboard/metrics)
  nodes: [coach, ref]                     # one single-node replica per node -> gateway load-balances
  port: 8000
  max_model_len: 262144                   # native (no YaRN); cheap here, KV pool is huge
  gpu_memory_utilization: 0.85
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  extra_args:
  - --trust-remote-code
  - --load-format=safetensors             # single-node -> streamed (NOT fastsafetensors, NOT eager)
  # ── the fix: multi-turn reasoning re-sends the growing history each turn. Prefix caching makes
  # turn N re-prefill only the NEW tokens; chunked prefill interleaves that prefill with ongoing
  # decode so a new turn doesn't stall the other conversations' token gen. Baseline had neither
  # (live metric: prefix_cache_queries_total = 0).
  - --enable-prefix-caching
  - --enable-chunked-prefill
  # ── fp8 KV: halves KV bytes read per decode step (64 layers x head_dim 256 makes this nontrivial),
  # modestly faster decode at longer context; small quality cost.
  - --kv-cache-dtype=fp8
  # NOTE vs baseline: dropped --safetensors-load-strategy=eager (host-RAM OOM risk, no gen benefit)
  # and env VLLM_USE_FLASHINFER_MOE_FP4=1 (deprecated AND a no-op here — this model is dense, no MoE).
  # Never add --enforce-eager (kills CUDA-graph capture -> slower decode).
  #
  # 2-replica caveat: with simple-shuffle routing each turn is routed independently, so ~half of a
  # conversation's follow-up turns land on the OTHER node and miss its prefix cache. You still get a
  # partial win; a single replica (node: coach) would give one shared cache if latency > aggregate.
