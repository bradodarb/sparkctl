# Generated by `sparkctl create recipe` — edit freely.
# DGX Spark defaults baked in: fast (no-mmap) weight loading; for multinode
# (tensor>=2) RAY_memory_monitor_refresh_ms=0 avoids spurious Ray OOM kills.
name: qwen3.6-27b-nvfp4
services:
- name: agent
  engine: vllm
  provider: hf
  model: nvidia/Qwen3.6-27B-NVFP4
  served_name: qwen3.6-27b-nvfp4
  nodes: [coach, ref]           # one single-node replica per node (agent-coach / agent-ref),
                                # same served_name -> gateway load-balances the two endpoints
  port: 8000
  max_model_len: 262144
  gpu_memory_utilization: 0.85
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  extra_args:
  - --trust-remote-code
  - --load-format=safetensors
  - --safetensors-load-strategy=eager
  env:
    VLLM_USE_FLASHINFER_MOE_FP4: '1'
